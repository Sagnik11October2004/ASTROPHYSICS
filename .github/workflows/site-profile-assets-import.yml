name: One-time import of uploaded website profile images
on:
  push:
    branches:
      - intro-pop-video-zigzag-20261112
    paths:
      - .github/workflows/site-profile-assets-import.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image processing
        run: python -m pip install --quiet pillow requests
      - name: Download self-hosted portrait and academic profile banner
        run: |
          python - <<'PY'
          import io
          from pathlib import Path
          from PIL import Image
          import requests

          assets = {"portrait":"https://media.canva.com/v2/image-resize/format:JPG/height:150/quality:75/uri:ifs%3A%2F%2FM%2Fc10a9cc5-abc6-48ed-832c-a0efa648b258/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAKDcIgrA64NS8lXYATOBW68I25jHu5JHaaWLr7jqHaTV&exp=1794492391&osig=AAAAAAAAAAAAAAAAAAAAADZJ9CZ1xc-AvCZXTtxRSlr-lJ4_NsWxjose42BExa3C&signer=media-rpc&token=AAIAAU0AJGMxMGE5Y2M1LWFiYzYtNDhlZC04MzJjLWEwZWZhNjQ4YjI1OAAAAAABodAU3liPU6lNF6bhQPnnJJhcq_aMUD3FFo0QiUZH658cocmZTA&x-canva-quality=thumbnail","banner":"https://media.canva.com/v2/image-resize/format:PNG/height:150/quality:100/uri:ifs%3A%2F%2FM%2F17feecfe-d065-4b29-98d0-a0e974acc6b6/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAOURfTv69H1sccQ005SvkRnlsKADXNnO-Wh0sbTzVlai&exp=1794493372&osig=AAAAAAAAAAAAAAAAAAAAACBx5wnpHmizMQfpzoX0xH2jBw4rAKj7eLoNZmBbjA4L&signer=media-rpc&token=AAIAAU0AJDE3ZmVlY2ZlLWQwNjUtNGIyOS05OGQwLWEwZTk3NGFjYzZiNgAAAAABodAj1mAa7ff31OUlOs_AS2FegXCAwWusg-IArOY5A77qfdux2g&x-canva-quality=thumbnail"}
          out=Path("docs/media")
          out.mkdir(parents=True,exist_ok=True)
          for name,url in assets.items():
              options = [
                  url.replace("/height:150/", "/height:900/").replace("/width:200", "/width:1200").replace("x-canva-quality=thumbnail","x-canva-quality=standard"),
                  url.replace("/height:150/", "/height:900/").replace("/width:200", "/width:1200"),
                  url
              ]
              largest=None
              for idx,u in enumerate(options):
                  try:
                      response=requests.get(u, timeout=30)
                      if response.status_code!=200: 
                          print(name,"variant",idx,"HTTP",response.status_code)
                          continue
                      image=Image.open(io.BytesIO(response.content)).convert("RGB")
                      print(name,"variant",idx,"received",image.size)
                      if largest is None or image.width*image.height>largest.width*largest.height:
                          largest=image.copy()
                  except Exception as exc: print(name,"variant",idx,"error",str(exc)[:150])
              if largest is None: raise RuntimeError("Failed to retrieve "+name)
              if name=="portrait":
                  # Original user photo 1536 x 1152; centered head-and-shoulders
                  w,h=largest.size
                  box=(int(.12*w),int(.248*h),int(.632*w),int(.924*h))
                  crop=largest.crop(box)
                  crop.thumbnail((460,460),Image.Resampling.LANCZOS)
                  crop.save(out/"sagnik-portrait.webp",format="WEBP",quality=88,method=5)
                  print("Wrote original portrait",crop.size)
              else:
                  largest.thumbnail((1400,1100),Image.Resampling.LANCZOS)
                  largest.save(out/"sagnik-academic-profile.webp",format="WEBP",quality=87,method=5)
                  print("Wrote academic graphic",largest.size)
          PY
      - name: Commit imported media to feature branch
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add docs/media/sagnik-portrait.webp docs/media/sagnik-academic-profile.webp
          if ! git diff --cached --quiet; then
            git commit -m "Import original portrait and generated academic banner as self-hosted WebP"
            git fetch --unshallow origin || true
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            git push origin HEAD:$GITHUB_REF_NAME
          fi
