name: Recover full museum portrait

on:
  push:
    branches:
      - restore-full-nobel-museum-photo-20261112
    paths:
      - .github/workflows/recover-museum-photo.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python3 -m pip install --quiet --break-system-packages pillow
      - name: Retrieve full original photo from user's uploaded image CDN
        shell: bash
        run: |
          python3 - <<'PY'
          import os,sys,urllib.request,urllib.error,io
          from PIL import Image,ImageOps
          choices=[["1536","https://media.canva.com/v2/image-resize/format:JPG/height:1152/quality:95/uri:ifs%3A%2F%2FM%2F5b1a3e5a-c018-401c-8e2d-137a51056253/watermark:F/width:1536?csig=AAAAAAAAAAAAAAAAAAAAAFMiKn5p0tqOdpeCj5jmDiUCcUMgS-cJhRgtNwYh5U6D&exp=1794498158&osig=AAAAAAAAAAAAAAAAAAAAAFrxPXnYqKyYxRoiJYBGQWM3BbUYAil_ci4iWaD69sIP&signer=media-rpc&token=AAIAAU0AJDViMWEzZTVhLWMwMTgtNDAxYy04ZTJkLTEzN2E1MTA1NjI1MwAAAAABodBs3bAItFxnxlF8E2km7q2Wkki74TzRj19jOLKM0Tqv-3LEAA&x-canva-quality=thumbnail"],["1200","https://media.canva.com/v2/image-resize/format:JPG/height:900/quality:85/uri:ifs%3A%2F%2FM%2F5b1a3e5a-c018-401c-8e2d-137a51056253/watermark:F/width:1200?csig=AAAAAAAAAAAAAAAAAAAAAFMiKn5p0tqOdpeCj5jmDiUCcUMgS-cJhRgtNwYh5U6D&exp=1794498158&osig=AAAAAAAAAAAAAAAAAAAAAFrxPXnYqKyYxRoiJYBGQWM3BbUYAil_ci4iWaD69sIP&signer=media-rpc&token=AAIAAU0AJDViMWEzZTVhLWMwMTgtNDAxYy04ZTJkLTEzN2E1MTA1NjI1MwAAAAABodBs3bAItFxnxlF8E2km7q2Wkki74TzRj19jOLKM0Tqv-3LEAA&x-canva-quality=thumbnail"],["800","https://media.canva.com/v2/image-resize/format:JPG/height:600/quality:85/uri:ifs%3A%2F%2FM%2F5b1a3e5a-c018-401c-8e2d-137a51056253/watermark:F/width:800?csig=AAAAAAAAAAAAAAAAAAAAAFMiKn5p0tqOdpeCj5jmDiUCcUMgS-cJhRgtNwYh5U6D&exp=1794498158&osig=AAAAAAAAAAAAAAAAAAAAAFrxPXnYqKyYxRoiJYBGQWM3BbUYAil_ci4iWaD69sIP&signer=media-rpc&token=AAIAAU0AJDViMWEzZTVhLWMwMTgtNDAxYy04ZTJkLTEzN2E1MTA1NjI1MwAAAAABodBs3bAItFxnxlF8E2km7q2Wkki74TzRj19jOLKM0Tqv-3LEAA&x-canva-quality=thumbnail"],["thumb","https://media.canva.com/v2/image-resize/format:JPG/height:150/quality:75/uri:ifs%3A%2F%2FM%2F5b1a3e5a-c018-401c-8e2d-137a51056253/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAFMiKn5p0tqOdpeCj5jmDiUCcUMgS-cJhRgtNwYh5U6D&exp=1794498158&osig=AAAAAAAAAAAAAAAAAAAAAFrxPXnYqKyYxRoiJYBGQWM3BbUYAil_ci4iWaD69sIP&signer=media-rpc&token=AAIAAU0AJDViMWEzZTVhLWMwMTgtNDAxYy04ZTJkLTEzN2E1MTA1NjI1MwAAAAABodBs3bAItFxnxlF8E2km7q2Wkki74TzRj19jOLKM0Tqv-3LEAA&x-canva-quality=thumbnail"]]
          success=[]
          for label,url in choices:
           try:
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
            with urllib.request.urlopen(req,timeout=40) as resp:
             data=resp.read()
            im=Image.open(io.BytesIO(data))
            print(label,'OK',im.size,'bytes',len(data),flush=True)
            if min(im.size)>=500:
             success.append((im.width*im.height,label,im.copy().convert("RGB")))
           except Exception as exc:
            print(label,'ERROR',str(exc)[:300],flush=True)
          if not success:
           raise SystemExit('No high-resolution source from Canva CDN; will try alternate authenticated export.')
          success.sort(key=lambda s:s[0],reverse=True)
          best=success[0][2]
          os.makedirs('docs/media',exist_ok=True)
          best.save('docs/media/sagnik-museum-original.jpg',format='JPEG',quality=89,optimize=True,progressive=True,subsampling=0)
          print('SELECTED',success[0][1],best.size,os.path.getsize('docs/media/sagnik-museum-original.jpg'),flush=True)
          
          PY
      - name: Publish full-resolution original photo
        shell: bash
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add docs/media/sagnik-museum-original.jpg
          git commit -m "Restore complete original museum photograph for profile"
          git fetch --unshallow origin || true
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin HEAD:$GITHUB_REF_NAME
